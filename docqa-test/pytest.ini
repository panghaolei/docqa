[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    -ra
    --strict-markers
    --strict-config
    --timeout=300
    --html=reports/report.html
    --self-contained-html

markers =
    unit: 纯单元测试，不依赖后端服务，任何环境都能跑
    smoke: 冒烟用例，快速验证服务可用性
    api: 接口功能测试，需要后端服务 (默认执行)
    rag: RAG 检索问答与质量评估，需要后端服务 + Embedding/LLM 可用
    perf: 性能并发测试，需要显式 --run-perf 才会执行
    e2e: 前端 UI 自动化，需要 --run-e2e 且已安装 Playwright
    ai: 依赖大模型判分（LLM-as-a-Judge），失败可重跑

filterwarnings =
    ignore::DeprecationWarning
